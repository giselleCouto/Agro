# Alternativa ao Caddy: nginx como proxy reverso (HTTPS via certbot).
# 1) sudo certbot --nginx -d agroroute.despaxai.com   (obtém o certificado)
# 2) inclua este server block e recarregue: sudo nginx -s reload
server {
    listen 80;
    server_name agroroute.despaxai.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name agroroute.despaxai.com;

    ssl_certificate     /etc/letsencrypt/live/agroroute.despaxai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agroroute.despaxai.com/privkey.pem;

    client_max_body_size 60M;   # upload de extrações CSV/XLSX

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
