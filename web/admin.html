<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOKAHI · Painel de Leads</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<style>body{font-family:'Inter',ui-sans-serif,system-ui,sans-serif}.ic{width:16px;height:16px}</style>
</head>
<body class="bg-gray-50 text-gray-900">
<header class="border-b bg-white sticky top-0 z-10">
  <div class="max-w-6xl mx-auto px-5 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-emerald-500 to-emerald-700 flex items-center justify-center">
        <i data-lucide="leaf" class="ic text-white"></i></div>
      <div><span class="font-bold">NOKAHI</span> <span class="text-gray-400 text-sm">· Painel de Leads</span></div>
    </div>
    <div class="flex items-center gap-2">
      <input id="token" type="password" placeholder="Token de admin"
        class="px-3 py-1.5 rounded-lg border text-sm w-52 focus:outline-none focus:ring-2 focus:ring-emerald-500">
      <button onclick="load()" class="px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold">Carregar</button>
    </div>
  </div>
</header>
<main class="max-w-6xl mx-auto px-5 py-6">
  <div id="summary" class="mb-4 text-sm text-gray-500"></div>
  <div id="err" class="hidden mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm p-3"></div>
  <div class="overflow-x-auto bg-white rounded-xl border">
    <table class="w-full text-sm">
      <thead class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wide">
        <tr>
          <th class="text-left px-3 py-2">Data</th><th class="text-left px-3 py-2">Nome</th>
          <th class="text-left px-3 py-2">Usina/Empresa</th><th class="text-left px-3 py-2">Contato</th>
          <th class="text-left px-3 py-2">Frota</th><th class="text-left px-3 py-2">Mensagem</th>
          <th class="text-left px-3 py-2">Status</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div id="empty" class="hidden text-center text-gray-400 py-12">Nenhum lead ainda. Informe o token e carregue.</div>
</main>
<script>
lucide.createIcons();
const STATUSES = ['novo','contatado','qualificado','descartado'];
const COLORS = {novo:'bg-blue-100 text-blue-700', contatado:'bg-amber-100 text-amber-700',
  qualificado:'bg-emerald-100 text-emerald-700', descartado:'bg-gray-100 text-gray-500'};
let token = '';

async function load() {
  token = document.getElementById('token').value.trim();
  const err = document.getElementById('err');
  err.classList.add('hidden');
  try {
    const r = await fetch('/v1/admin/leads', {headers:{'X-Admin-Token':token}});
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const data = await r.json();
    render(data);
  } catch (e) { err.textContent = 'Erro: ' + e.message; err.classList.remove('hidden'); }
}

function render(data) {
  document.getElementById('summary').textContent = `${data.count} lead(s) no total`;
  document.getElementById('empty').classList.toggle('hidden', data.leads.length > 0);
  document.getElementById('rows').innerHTML = data.leads.map(l => `
    <tr class="border-t hover:bg-gray-50">
      <td class="px-3 py-2 text-gray-500 whitespace-nowrap">${(l.created_at||'').replace('T',' ').slice(0,16)}</td>
      <td class="px-3 py-2 font-medium">${esc(l.name)}</td>
      <td class="px-3 py-2">${esc(l.company||'—')}</td>
      <td class="px-3 py-2"><a href="mailto:${esc(l.email)}" class="text-emerald-700 hover:underline">${esc(l.email)}</a>
        ${l.phone?`<div class="text-xs text-gray-400">${esc(l.phone)}</div>`:''}</td>
      <td class="px-3 py-2 text-gray-600">${esc(l.fleet_size||'—')}</td>
      <td class="px-3 py-2 text-gray-600 max-w-xs"><div class="truncate" title="${esc(l.message||'')}">${esc(l.message||'—')}</div></td>
      <td class="px-3 py-2">
        <select onchange="setStatus(${l.id}, this.value)" class="text-xs rounded px-2 py-1 border ${COLORS[l.status]||''}">
          ${STATUSES.map(s=>`<option value="${s}" ${s===l.status?'selected':''}>${s}</option>`).join('')}
        </select>
      </td>
    </tr>`).join('');
}
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function setStatus(id, status) {
  await fetch(`/v1/admin/leads/${id}/status`, {method:'POST',
    headers:{'X-Admin-Token':token,'Content-Type':'application/json'}, body:JSON.stringify({status})});
}
</script>
</body>
</html>
