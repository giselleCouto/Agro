version: "3.9"

services:
  # ============================================================
  # PostgreSQL + PostGIS
  # ============================================================
  db:
    image: postgis/postgis:16-3.4
    container_name: canaroute-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: canaroute
      POSTGRES_USER: ${DB_USER:-canaroute}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-canaroute_secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canaroute"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ============================================================
  # Redis (cache de rotas e resultados)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: canaroute-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ============================================================
  # OSRM Backend (roteamento local com dados OSM Brasil)
  # ============================================================
  osrm:
    image: osrm/osrm-backend:v5.27.1
    container_name: canaroute-osrm
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data/osm:/data
    command: osrm-routed --algorithm mld /data/brazil-latest.osrm
    profiles:
      - full  # Ativado apenas quando dados OSM estão disponíveis

  # ============================================================
  # GraphHopper (roteamento avançado com perfis customizados)
  # ============================================================
  graphhopper:
    image: israelhikingmap/graphhopper:9.1
    container_name: canaroute-graphhopper
    restart: unless-stopped
    ports:
      - "8989:8989"
    volumes:
      - ./docker/graphhopper/config.yml:/graphhopper/config.yml
      - ./data/osm:/graphhopper/data
    environment:
      JAVA_OPTS: "-Xmx4g -Xms1g"
    profiles:
      - full  # Ativado apenas quando dados OSM estão disponíveis

  # ============================================================
  # FastAPI Backend
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: canaroute-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-canaroute}:${DB_PASSWORD:-canaroute_secret}@db:5432/canaroute
      REDIS_URL: redis://redis:6379/0
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
      OSRM_PUBLIC_URL: ${OSRM_PUBLIC_URL:-http://router.project-osrm.org}
      GRAPHHOPPER_URL: ${GRAPHHOPPER_URL:-http://graphhopper:8989}
      SRTM_DATA_DIR: /app/data/srtm
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./data/srtm:/app/data/srtm
      - ./data/shapefiles:/app/data/shapefiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================
  # React Frontend
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: canaroute-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ============================================================
  # Nginx Reverse Proxy
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: canaroute-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  redisdata:
